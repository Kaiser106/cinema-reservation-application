server:
  port: 8080

spring:
  application:
    name: cinema-reservation-app

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cinema_db}
    username: ${POSTGRES_USER:cinema}
    password: ${POSTGRES_PASSWORD:cinema_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    # We rely on Flyway, NOT hibernate ddl-auto.
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:cinema_logs}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  phone-number: ${TWILIO_PHONE_NUMBER}

iyzico:
  api-key: ${IYZICO_API_KEY}
  secret-key: ${IYZICO_SECRET_KEY}
  base-url: ${IYZICO_BASE_URL}

logging:
  level:
    com.cinema: DEBUG